<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="430" fill="#0f1420"/>
  <text x="20" y="34" fill="#4da3ff" font-size="18" font-weight="600">Story 1 — Community validation of a low-resource-language entity</text>

  <!-- Stage 1: Contributor + Scaffolding -->
  <rect x="30" y="90" width="150" height="86" rx="10" fill="#171e2e" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="105" y="120" fill="#dde3f0" font-size="13" text-anchor="middle" font-weight="600">Contributor</text>
  <text x="105" y="140" fill="#8fa0bf" font-size="11" text-anchor="middle">proposes entity via</text>
  <text x="105" y="156" fill="#8fa0bf" font-size="11" text-anchor="middle">Agentic Scaffolding</text>
  <text x="105" y="172" fill="#8fa0bf" font-size="10" text-anchor="middle">(ElizaOS, LLM-guided)</text>

  <rect x="230" y="90" width="150" height="86" rx="10" fill="#171e2e" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="305" y="120" fill="#dde3f0" font-size="13" text-anchor="middle" font-weight="600">WP4 Extraction (AI)</text>
  <text x="305" y="140" fill="#8fa0bf" font-size="11" text-anchor="middle">candidate entity</text>
  <text x="305" y="156" fill="#3fce7c" font-size="11" text-anchor="middle">status = gfen:pending</text>
  <text x="305" y="172" fill="#8fa0bf" font-size="10" text-anchor="middle">published immediately</text>

  <!-- Arrows 1 -->
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8fa0bf"/></marker></defs>
  <line x1="180" y1="133" x2="226" y2="133" stroke="#8fa0bf" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2: DAO -->
  <rect x="430" y="80" width="180" height="106" rx="10" fill="#171e2e" stroke="#ffb020" stroke-width="1.5"/>
  <text x="520" y="112" fill="#dde3f0" font-size="13" text-anchor="middle" font-weight="600">DAO — Quadratic Voting</text>
  <text x="520" y="132" fill="#8fa0bf" font-size="11" text-anchor="middle">reputation-weighted review</text>
  <text x="520" y="150" fill="#8fa0bf" font-size="11" text-anchor="middle">quorum + sybil resistance</text>
  <text x="520" y="172" fill="#ffb020" font-size="11" text-anchor="middle">validated · disputed · rejected</text>

  <line x1="380" y1="133" x2="426" y2="133" stroke="#8fa0bf" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3: Decision -->
  <rect x="660" y="90" width="150" height="86" rx="10" fill="#171e2e" stroke="#3fce7c" stroke-width="1.5"/>
  <text x="735" y="120" fill="#dde3f0" font-size="13" text-anchor="middle" font-weight="600">Governance Decision</text>
  <text x="735" y="140" fill="#8fa0bf" font-size="11" text-anchor="middle">dereferenceable PID</text>
  <text x="735" y="156" fill="#4da3ff" font-size="11" text-anchor="middle">w3id.org/fen/id/decision/g…</text>
  <text x="735" y="172" fill="#8fa0bf" font-size="10" text-anchor="middle">hash anchored on-chain</text>

  <line x1="610" y1="133" x2="656" y2="133" stroke="#8fa0bf" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 4: KG -->
  <rect x="850" y="90" width="110" height="86" rx="10" fill="#171e2e" stroke="#3fce7c" stroke-width="1.5"/>
  <text x="905" y="120" fill="#dde3f0" font-size="13" text-anchor="middle" font-weight="600">SSH KG</text>
  <text x="905" y="140" fill="#8fa0bf" font-size="11" text-anchor="middle">named graph</text>
  <text x="905" y="156" fill="#3fce7c" font-size="11" text-anchor="middle">status updated</text>
  <text x="905" y="172" fill="#8fa0bf" font-size="10" text-anchor="middle">Virtuoso</text>

  <line x1="810" y1="133" x2="846" y2="133" stroke="#8fa0bf" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom strip: guarantees -->
  <rect x="30" y="240" width="930" height="150" rx="10" fill="#171e2e" stroke="#26314d" stroke-width="1"/>
  <text x="50" y="268" fill="#4da3ff" font-size="13" font-weight="600">Guarantees (ADR-001/003, D2.2 §4.1)</text>
  <text x="50" y="296" fill="#8fa0bf" font-size="12">• No blocking points — the pipeline publishes candidates immediately as gfen:pending; a vote is an async in-place update.</text>
  <text x="50" y="320" fill="#8fa0bf" font-size="12">• GDPR — only a decision hash is anchored on-chain; all content stays in Virtuoso (right to erasure preserved).</text>
  <text x="50" y="344" fill="#8fa0bf" font-size="12">• Auditability — decision record exposes quorum, outcome, method, reputation snapshot and PID; individual votes are never published.</text>
  <text x="50" y="368" fill="#8fa0bf" font-size="12">• If the community never votes, the record remains gfen:pending with an explicit "unverified" marker.</text>
</svg>
