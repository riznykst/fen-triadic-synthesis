<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="430" fill="#0f1420"/>
  <text x="20" y="34" fill="#4da3ff" font-size="18" font-weight="600">Story 2 — Validation overlay for ANY dataset</text>

  <!-- Left: generic datasets -->
  <rect x="30" y="90" width="170" height="96" rx="10" fill="#171e2e" stroke="#8fa0bf" stroke-width="1.5"/>
  <text x="115" y="120" fill="#dde3f0" font-size="13" text-anchor="middle" font-weight="600">Any dataset</text>
  <text x="115" y="140" fill="#8fa0bf" font-size="11" text-anchor="middle">historical events · places</text>
  <text x="115" y="156" fill="#8fa0bf" font-size="11" text-anchor="middle">cultural artefacts · records</text>
  <text x="115" y="172" fill="#8fa0bf" font-size="11" text-anchor="middle">community data</text>

  <defs><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8fa0bf"/></marker></defs>

  <!-- Generic candidate -->
  <rect x="250" y="90" width="180" height="96" rx="10" fill="#171e2e" stroke="#4da3ff" stroke-width="1.5"/>
  <text x="340" y="120" fill="#dde3f0" font-size="13" text-anchor="middle" font-weight="600">EntityCandidate</text>
  <text x="340" y="140" fill="#8fa0bf" font-size="11" text-anchor="middle">generic payload — any fields</text>
  <text x="340" y="156" fill="#8fa0bf" font-size="11" text-anchor="middle">no schema coupling</text>
  <text x="340" y="172" fill="#3fce7c" font-size="11" text-anchor="middle">same Kafka topics</text>

  <line x1="200" y1="138" x2="246" y2="138" stroke="#8fa0bf" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Shared layer -->
  <rect x="480" y="70" width="220" height="136" rx="10" fill="#171e2e" stroke="#ffb020" stroke-width="1.5"/>
  <text x="590" y="100" fill="#ffb020" font-size="13" text-anchor="middle" font-weight="600">Validation layer (reused)</text>
  <text x="590" y="122" fill="#8fa0bf" font-size="11" text-anchor="middle">pluggable LLM judge</text>
  <text x="590" y="140" fill="#8fa0bf" font-size="11" text-anchor="middle">(OpenAI-compatible API:</text>
  <text x="590" y="156" fill="#8fa0bf" font-size="11" text-anchor="middle">DeepSeek, LLM4SSH, Quagga…)</text>
  <text x="590" y="176" fill="#8fa0bf" font-size="11" text-anchor="middle">+ DAO / Quadratic Voting</text>
  <text x="590" y="194" fill="#8fa0bf" font-size="11" text-anchor="middle">fallback to deterministic rule</text>

  <line x1="430" y1="138" x2="476" y2="138" stroke="#8fa0bf" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Provenance -->
  <rect x="750" y="90" width="200" height="96" rx="10" fill="#171e2e" stroke="#3fce7c" stroke-width="1.5"/>
  <text x="850" y="120" fill="#dde3f0" font-size="13" text-anchor="middle" font-weight="600">gfen: provenance</text>
  <text x="850" y="140" fill="#8fa0bf" font-size="11" text-anchor="middle">status · method · PID · anchor</text>
  <text x="850" y="156" fill="#3fce7c" font-size="11" text-anchor="middle">additive namespace</text>
  <text x="850" y="172" fill="#8fa0bf" font-size="10" text-anchor="middle">triple:* untouched (ADR-002)</text>

  <line x1="700" y1="138" x2="746" y2="138" stroke="#8fa0bf" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Bottom strip -->
  <rect x="30" y="240" width="920" height="150" rx="10" fill="#171e2e" stroke="#26314d" stroke-width="1"/>
  <text x="50" y="268" fill="#4da3ff" font-size="13" font-weight="600">Why it is an overlay, not a bespoke pipeline</text>
  <text x="50" y="296" fill="#8fa0bf" font-size="12">• Dataset owners map their records to EntityCandidate and reuse the same bridge, webhook and consumer — no FEN code changes.</text>
  <text x="50" y="320" fill="#8fa0bf" font-size="12">• The LLM judge reviews the whole record generically; the DAO outcome applies to any dataset type.</text>
  <text x="50" y="344" fill="#8fa0bf" font-size="12">• Same dereferenceable PID scheme (ADR-003) and same SHACL shapes for governance provenance.</text>
  <text x="50" y="368" fill="#8fa0bf" font-size="12">• FEN is not a linguistics tool — it is community governance for any data that needs human arbitration over automation.</text>
</svg>
