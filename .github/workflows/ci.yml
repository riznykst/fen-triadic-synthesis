name: CI

# TEMPORARY self-hosted-runner mode (GitHub billing block): jobs run on the
# local runner (label "self-hosted") and CI triggers on push only, so fork
# PRs cannot execute code on the private machine. Revert to ubuntu-latest +
# pull_request when the billing issue is resolved — see
# docs/self-hosted-runner.md, step 7.
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-common.txt
      - name: Run tests
        run: pytest -q
      - name: Verify imports
        run: |
          python -c "import services.common.messages, services.common.gfen_ontology, services.common.pid, services.common.kafka_io, services.common.llm, services.fen_bridge.webhook, services.validation_consumer.sparql_updater, mock_fen_api.main; print('imports OK')"
      - name: Parse RDF artefacts
        run: |
          python -c "from rdflib import Graph, Dataset; g=Graph(); g.parse('docs/ontology/fen-ontology.ttl', format='turtle'); d=Dataset(); d.parse('examples/sample-validation-flow.trig', format='trig'); print('RDF OK', len(g), len(d))"

  # End-to-end smoke test against the real docker-compose stack: publishes an
  # EntityCandidate and waits for the full pipeline (decision -> SPARQL ->
  # validated) to complete. Requires a Docker runner.
  e2e:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-common.txt
      - name: Check Docker availability
        id: docker
        shell: bash
        run: |
          if docker version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Start the stack
        if: steps.docker.outputs.available == 'true'
        run: docker compose up --build -d
      - name: Run end-to-end smoke test
        if: steps.docker.outputs.available == 'true'
        run: python scripts/smoke_test.py
      - name: Tear down the stack
        if: always() && steps.docker.outputs.available == 'true'
        run: docker compose down
