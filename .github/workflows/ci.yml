name: CI

# TEMPORARY self-hosted-runner mode (GitHub billing block): jobs run on the
# local runner (label "self-hosted") and CI triggers on push only, so fork
# PRs cannot execute code on the private machine. The matrix is reduced to
# the system Python (3.10) because actions/setup-python toolchains are wiped
# by this environment after jobs. The e2e job REQUIRES Docker and fails when
# the daemon is unavailable (it used to skip the steps, which reported a run
# that verified nothing as green — TECH-DEBT P3). Revert to ubuntu-latest +
# pull_request + the full 3.10/3.11/3.12 matrix + setup-python once the
# billing issue is resolved — see docs/self-hosted-runner.md, step 7.
#
# e2e scope: this workflow is skipped when a push touches ONLY web/ (native
# `paths-ignore`) — web-only pushes run the unit suite via .github/workflows/
# web.yml instead and never touch Docker. The CI stack cannot share the
# published host ports with a locally running dev stack, so web-only changes
# should not fight over them. Mixed pushes (web + anything else) run both
# workflows; the unit suite then runs twice, which is harmless.
on:
  push:
    branches: [main]
    paths-ignore: ['web/**']
  # Manual runs from the Actions UI ("Run workflow") or CLI
  # (`gh workflow run CI`): lets the full test+e2e suite be re-run on demand
  # without an empty commit. Still self-hosted only, so no fork code runs.
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        # TEMPORARY: system Python (C:\Python310) on the self-hosted runner.
        # Restore ["3.10", "3.11", "3.12"] together with setup-python below.
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v5
      # TEMPORARY: replace with actions/setup-python@v5 when back on hosted.
      - name: Use system Python
        run: python --version
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements-common.txt
      - name: Run tests
        run: pytest -q
      - name: Verify imports
        run: |
          python -c "import services.common.messages, services.common.gfen_ontology, services.common.pid, services.common.kafka_io, services.common.llm, services.fen_bridge.webhook, services.validation_consumer.sparql_updater, mock_fen_api.main; print('imports OK')"
      - name: Parse RDF artefacts
        run: |
          python -c "from rdflib import Graph, Dataset; g=Graph(); g.parse('docs/ontology/fen-ontology.ttl', format='turtle'); d=Dataset(); d.parse('examples/sample-validation-flow.trig', format='trig'); print('RDF OK', len(g), len(d))"
      - name: SHACL validation
        run: python scripts/shacl_check.py
      - name: JS tests (web/shared + web/tests, node --test)
        run: node --test "web/tests/*.test.js"

  # End-to-end smoke test against the real docker-compose stack: publishes an
  # EntityCandidate and waits for the full pipeline (decision -> SPARQL ->
  # validated) to complete. Requires a Docker runner; skipped on machines
  # without Docker. Runs for any push that touches anything outside web/
  # (web-only pushes never reach this workflow — see the trigger).
  e2e:
    runs-on: self-hosted
    env:
      # Isolate the CI stack from any locally-running dev stack on the same
      # Docker daemon: both would otherwise default to the project name
      # "fen-triadic-synthesis", so CI "up/down" collides with (and can tear
      # down) the developer's local containers. With this override the CI
      # containers are fen-ci-*; if the local stack holds the published
      # ports, the compose up step fails fast with "port is already
      # allocated" instead of silently destroying local state.
      COMPOSE_PROJECT_NAME: fen-ci
      # A just-restarted Docker daemon (fresh WSL data disk, images being rebuilt)
      # can answer slowly: run 35441207076 lost the community-mode smoke to a 120 s
      # Kafka probe. The smoke test reads this for its readiness waits.
      FEN_SMOKE_READY_TIMEOUT_S: "240"
    steps:
      - uses: actions/checkout@v5
      # Run 35439138625 went red for an environment reason, not a code reason:
      # C: was full, so `npm install` died with ENOSPC inside the Playwright step
      # and the runner could not even write its own _diag log — which is why the
      # dump/teardown steps never ran and the fen-ci stack stayed up holding the
      # ports. Fail here instead, with the real cause on the first line, before
      # pip/docker/npm consume the remaining space.
      - name: Check free disk space
        id: disk
        shell: powershell
        run: |
          $free = [math]::Round((Get-PSDrive C).Free / 1GB, 2)
          Write-Output "free on C:: $free GB"
          if ($free -lt 5) {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Output "::error::Only $free GB free on C: - the e2e stack (docker images + npm + Playwright) needs about 5 GB, and a run started now fails mid-step with ENOSPC (see run 35439138625). Free space, then re-run."
            exit 1
          }
          "available=true" >> $env:GITHUB_OUTPUT
      # TEMPORARY: replace with actions/setup-python@v5 when back on hosted.
      - name: Use system Python
        run: python --version
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements-common.txt
      # NOTE: shell is `powershell` (Windows PowerShell 5.1, always in
      # System32): `bash` resolves to WSL bash here (breaks Windows paths)
      # and `pwsh` is not resolvable in the runner's PATH on this machine.
      # Restore `shell: bash` when CI returns to ubuntu-latest.
      - name: Check Docker availability
        id: docker
        shell: powershell
        run: |
          # cmd-level redirection: never lets a daemon-down stderr turn into a
          # PowerShell error record (which failed this step with exit 1 before).
          cmd /c "docker version >nul 2>&1"
          if ($LASTEXITCODE -eq 0) {
            "available=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          # FAIL instead of skipping (TECH-DEBT P3). A skipped e2e is reported
          # as a green run, and that twice looked like a verified pipeline:
          # 34683789453/34516405912 showed 17-22s "success" runs with every e2e
          # step skipped because Docker Desktop was off, and 34690189118 did it
          # again (18s, all steps skipped). A run that verifies nothing must not
          # be green.
          "available=false" >> $env:GITHUB_OUTPUT
          Write-Output "::error::Docker daemon unreachable - this e2e job would verify NOTHING. Start Docker Desktop (docs/self-hosted-runner.md) and re-run the workflow."
          exit 1
      - name: Start the stack
        if: steps.docker.outputs.available == 'true'
        # --wait blocks until every container with a healthcheck is healthy, so a
        # slow start becomes a clear failure here instead of a probe timeout later.
        run: docker compose --profile virtuoso up --build -d --wait --wait-timeout 300
      - name: Run end-to-end smoke test
        if: steps.docker.outputs.available == 'true'
        run: python scripts/smoke_test.py
      # Community and QV are separate steps on purpose: they used to be one step
      # with four commands, and GitHub Actions only checks the exit code of the
      # LAST command. Run 35441207076 proved the hole - the log contained
      # "ERROR E2E SMOKE TEST FAILED (community mode): timed out after 120s
      # waiting for Kafka", the step still reported success, and the run went
      # green. Each mode now ends with the command it asserts, plus explicit
      # exit-code checks, so a failure cannot hide behind the next command.
      - name: Run community voting e2e
        if: steps.docker.outputs.available == 'true'
        shell: powershell
        run: |
          $env:FEN_MOCK_VOTING = 'community'
          $env:FEN_MOCK_QUORUM = '2'
          docker compose -f docker-compose.yml -f docker-compose.voting.yml --profile virtuoso up -d --wait --wait-timeout 300
          if ($LASTEXITCODE -ne 0) { throw "the stack did not become healthy for community mode (exit $LASTEXITCODE)" }
          python scripts/smoke_test.py --mode community
          if ($LASTEXITCODE -ne 0) { throw "community-mode smoke test FAILED (exit $LASTEXITCODE)" }
      - name: Run QV voting e2e
        if: steps.docker.outputs.available == 'true'
        shell: powershell
        run: |
          $env:FEN_MOCK_VOTING = 'qv'
          $env:FEN_MOCK_QV_THRESHOLD = '10'
          docker compose -f docker-compose.yml -f docker-compose.voting.yml --profile virtuoso up -d --wait --wait-timeout 300
          if ($LASTEXITCODE -ne 0) { throw "the stack did not become healthy for qv mode (exit $LASTEXITCODE)" }
          python scripts/smoke_test.py --mode qv
          if ($LASTEXITCODE -ne 0) { throw "qv-mode smoke test FAILED (exit $LASTEXITCODE)" }
      - name: Run Virtuoso dialect check
        if: steps.docker.outputs.available == 'true'
        run: python scripts/virtuoso_dialect_check.py
      - name: Run UI e2e (Playwright, zero-build portal views)
        if: steps.docker.outputs.available == 'true'
        shell: powershell
        run: |
          # The voting steps above left the mock in qv mode; UI e2e expects
          # the default auto mode (submit -> simulated DAO decides).
          docker compose -f docker-compose.yml -f docker-compose.voting.yml up -d --wait --wait-timeout 120 mock-fen-api
          if ($LASTEXITCODE -ne 0) { throw "mock-fen-api did not become healthy before the UI e2e (exit $LASTEXITCODE)" }
          cd web
          # Reuse an existing install when the runner still has it: a fresh
          # `npm install` writes ~50 MB every run and, on a full disk, fails with
          # ENOSPC instead of a meaningful message (run 35439138625).
          if (Test-Path 'node_modules\@playwright\test') {
            Write-Output 'reusing the existing @playwright/test install'
          } else {
            npm install --no-save --prefer-offline @playwright/test
          }
          # `playwright install` is idempotent: it skips a browser revision that
          # is already present.
          npx playwright install chromium
          npx playwright test
      - name: Dump the stack logs on failure
        # The smoke test can only report ITS OWN view (e.g. "no
        # fen.governance.decisions.v1 message within 30s"); whether the
        # candidate ever reached the bridge is only visible in the container
        # logs, and the stack is still up here (teardown is `if: always()`).
        # Without this, a lost/dropped message takes another CI cycle to
        # diagnose — see run 34686489718.
        # Guarded by the Docker check as well: when the daemon is down (and the
        # `Check Docker availability` step has already failed the job), `docker
        # compose logs` fails too and adds a second, meaningless red step.
        if: failure() && steps.docker.outputs.available == 'true'
        run: docker compose --profile virtuoso logs --tail=80 --no-color
      - name: Tear down the stack
        if: always() && steps.docker.outputs.available == 'true'
        run: docker compose --profile virtuoso down