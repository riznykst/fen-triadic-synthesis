# validation-consumer — reads fen.governance.decisions.v1, applies the
# governance update into the named graph via SPARQL, and publishes
# EntityValidated (services/validation_consumer/main.py).
# Image tag is a PLACEHOLDER; the build pipeline replaces it with the real
# tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-consumer
  labels:
    app.kubernetes.io/name: validation-consumer
    app.kubernetes.io/part-of: fen-triadic-synthesis
spec:
  replicas: 1 # Kafka consumer group — scale-out must not exceed partitions
  selector:
    matchLabels:
      app.kubernetes.io/name: validation-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: validation-consumer
    spec:
      containers:
        - name: consumer
          image: fen/validation-consumer:latest # placeholder — tag replaced at build
          envFrom:
            - configMapRef:
                name: fen-config
            # SPARQL_UPDATE_USER/PASSWORD — create the Secret first (see
            # configmap.yaml); uncomment once it exists:
            # - secretRef:
            #     name: fen-sparql-credentials
          ports:
            - name: metrics
              containerPort: 9102
          # The process serves Prometheus metrics on METRICS_PORT (default
          # 9102, services/validation_consumer/main.py) — probe it so a
          # crashed/wedged consumer is restarted and never silently stalls
          # candidates at gfen:pending.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# Headless Service kept for uniform service discovery; the consumer process
# exposes no application HTTP API (it only consumes Kafka + issues SPARQL
# updates) — /metrics on 9102 is the only HTTP port (scraped by Prometheus).
apiVersion: v1
kind: Service
metadata:
  name: validation-consumer
  labels:
    app.kubernetes.io/name: validation-consumer
    app.kubernetes.io/part-of: fen-triadic-synthesis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: validation-consumer
