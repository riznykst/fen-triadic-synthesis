# Status API — read-side web service (web-interface layer; data source for the
# Flow 2 status widget). Read-only by design (ADR-001): writes to the graph
# belong exclusively to the Validation Result Consumer. Kafka and the RDF
# store (Virtuoso in production) are EXTERNAL to this deployment — see
# docs/architecture.md, "Kubernetes / OKD deployment".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  labels:
    app.kubernetes.io/name: status-api
    app.kubernetes.io/part-of: fen-triadic-synthesis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: status-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-api
        app.kubernetes.io/part-of: fen-triadic-synthesis
    spec:
      containers:
        - name: status-api
          image: fen/status-api:latest  # TODO: replace at build time
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: fen-config
          # SPARQL_QUERY/PING_ENDPOINT and FEN_WEB_DIR come from fen-config
          # (env-shared.yaml) — no per-deployment duplicates that can drift.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: status-api
  labels:
    app.kubernetes.io/name: status-api
    app.kubernetes.io/part-of: fen-triadic-synthesis
spec:
  selector:
    app.kubernetes.io/name: status-api
  ports:
    - port: 8082
      targetPort: 8082
