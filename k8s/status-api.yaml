# Status API — read-side web service (web-interface layer; data source for the
# Flow 2 status widget). Read-only by design (ADR-001): writes to the graph
# belong exclusively to the Validation Result Consumer. Kafka and the RDF
# store (Virtuoso in production) are EXTERNAL to this deployment — see
# docs/architecture.md, "Kubernetes / OKD deployment".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  labels:
    app.kubernetes.io/part-of: fen-triadic-synthesis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-api
  template:
    metadata:
      labels:
        app: status-api
    spec:
      containers:
        - name: status-api
          image: fen/status-api:latest  # TODO: replace at build time
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: fen-config
          env:
            - name: SPARQL_QUERY_ENDPOINT
              value: "http://virtuoso:8890/sparql"  # TODO: GRAPHIA query endpoint
            - name: SPARQL_PING_ENDPOINT
              value: "http://virtuoso:8890/sparql"  # TODO: store probe endpoint
            - name: FEN_WEB_DIR
              value: "web"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: status-api
  labels:
    app.kubernetes.io/part-of: fen-triadic-synthesis
spec:
  selector:
    app: status-api
  ports:
    - port: 8082
      targetPort: 8082
