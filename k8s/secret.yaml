# FEN_WEBHOOK_TOKEN — the webhook rejects decision callbacks without a valid
# Bearer token (see services/fen_bridge/webhook.py).
#
# FAIL-CLOSED: the value below is intentionally NOT valid base64
# ("REPLACE-ME-with-a-real-token" contains '-'), so `kubectl apply` REFUSES
# this Secret until a real token is set. An empty/absent token would make
# the webhook accept forged GovernanceDecisions — the exact attack the
# token check exists to block — so it must never be deployable as-is.
#
#   printf '%s' 'a-strong-random-token' | base64
# then paste the output here and apply.
apiVersion: v1
kind: Secret
metadata:
  name: fen-webhook-token
  labels:
    app.kubernetes.io/part-of: fen-triadic-synthesis
type: Opaque
data:
  FEN_WEBHOOK_TOKEN: "REPLACE-ME-with-a-real-token" # INVALID base64 on purpose — set a real token first
