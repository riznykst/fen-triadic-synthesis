# FEN_WEBHOOK_TOKEN — the webhook rejects decision callbacks without a valid
# Bearer token (see services/fen_bridge/webhook.py). The value below is the
# base64 of the EMPTY string, i.e. "no auth" — safe only for local dev.
# Set a real token before any non-local deployment:
#   printf '%s' 'change-me' | base64
# and paste the output as the value of FEN_WEBHOOK_TOKEN.
apiVersion: v1
kind: Secret
metadata:
  name: fen-webhook-token
  labels:
    app.kubernetes.io/part-of: fen-triadic-synthesis
type: Opaque
data:
  FEN_WEBHOOK_TOKEN: "" # base64 of empty string == no token; SET REAL TOKEN
